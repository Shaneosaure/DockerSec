name: Hadolint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '28 13 * * 2'

permissions:
  contents: read

jobs:
  hadolint:
    name: Run hadolint scanning on all Dockerfiles
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Find and lint all Dockerfiles
        run: |
          mkdir -p hadolint-results
          for file in $(find ./source/DockerFiles -type f -iname "Dockerfile"); do
            echo "Linting $file"
            hadolint "$file" -f sarif > "hadolint-results/$(basename $(dirname $file)).sarif" || true
          done

      - name: Merge SARIF results
        run: |
          jq -s '{ "runs": map(.runs) | add }' hadolint-results/*.sarif > hadolint-results/all-hadolint.sarif

      - name: Upload analysis results to GitHub
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: hadolint-results/all-hadolint.sarif
          wait-for-processing: true
