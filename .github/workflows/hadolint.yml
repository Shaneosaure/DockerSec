name: Hadolint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '18 15 * * 4'

permissions:
  contents: read

jobs:
  hadolint:
    name: Run Hadolint on all Dockerfiles
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1️⃣ dhcp-server
      - name: Lint dhcp-server Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./DockerFiles/dhcp-server/Dockerfile
          format: sarif
          output-file: hadolint-dhcp-server.sarif
          no-fail: true

      # 2️⃣ dmz-router-external
      - name: Lint dmz-router-external Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./DockerFiles/dmz-router-external/Dockerfile
          format: sarif
          output-file: hadolint-dmz-router-external.sarif
          no-fail: true

      # 3️⃣ dmz-router-internal
      - name: Lint dmz-router-internal Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./DockerFiles/dmz-router-internal/Dockerfile
          format: sarif
          output-file: hadolint-dmz-router-internal.sarif
          no-fail: true

      # 4️⃣ dns-server
      - name: Lint dns-server Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./DockerFiles/dns-server/Dockerfile
          format: sarif
          output-file: hadolint-dns-server.sarif
          no-fail: true

      # 5️⃣ eve
      - name: Lint eve Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./DockerFiles/eve/Dockerfile
          format: sarif
          output-file: hadolint-eve.sarif
          no-fail: true

      # 6️⃣ http-server
      - name: Lint http-server Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./DockerFiles/http-server/Dockerfile
          format: sarif
          output-file: hadolint-http-server.sarif
          no-fail: true

      # 7️⃣ pc1
      - name: Lint pc1 Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./DockerFiles/pc1/Dockerfile
          format: sarif
          output-file: hadolint-pc1.sarif
          no-fail: true

      # 📤 Upload all SARIF reports (GitHub gère plusieurs fichiers)
      - name: Upload Hadolint results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: .
          wait-for-processing: true
