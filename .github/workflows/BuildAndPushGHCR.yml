name: Build and Push All Docker Images to GHCR

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - image: dhcp-server
            file: DOCKERFILE
            tag: latest
          - image: dmz-router-external
            file: DOCKERFILE
            tag: latest
          - image: dmz-router-internal
            file: DOCKERFILE
            tag: latest
          - image: dns-server
            file: DOCKERFILE
            tag: latest
          - image: eve
            file: DOCKERFILE
            tag: latest
          - image: eve
            file: DOCKERFILE-FULL
            tag: full
          - image: eve
            file: DOCKERFILE-LIGHT
            tag: light
          - image: http-server
            file: DOCKERFILE
            tag: latest
          - image: pc1
            file: DOCKERFILE
            tag: latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare lowercase owner name
        id: vars
        run: echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Special case for http-server (Juice Shop) ---
      - name: Clone OWASP Juice Shop (only for http-server)
        if: matrix.image == 'http-server'
        run: |
          git clone https://github.com/juice-shop/juice-shop.git /tmp/juice-shop
          cd /tmp/juice-shop
          git checkout v19.0.0
          cd -
          cp ./source/DockerFiles/http-server/DOCKERFILE /tmp/juice-shop/Dockerfile
          sed -i 's/safetyOverride: false/safetyOverride: true/' /tmp/juice-shop/config/default.yml

      - name: Build and push ${{ matrix.image }} (${{ matrix.tag }})
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image == 'http-server' && '/tmp/juice-shop' || format('./source/DockerFiles/{0}', matrix.image) }}
          file: ${{ matrix.image == 'http-server' && '/tmp/juice-shop/Dockerfile' || format('./source/DockerFiles/{0}/{1}', matrix.image, matrix.file) }}
          push: true
          tags: |
            ghcr.io/${{ env.owner_lc }}/dockersec-${{ matrix.image }}:${{ matrix.tag }}
            ghcr.io/${{ env.owner_lc }}/dockersec-${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.title=dockersec-${{ matrix.image }}
            org.opencontainers.image.description=DockerSec component ${{ matrix.image }} (${{ matrix.tag }})
            org.opencontainers.image.licenses=MIT
