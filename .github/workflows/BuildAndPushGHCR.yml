name: Publish Docker Images to GHCR on Release

on:
  release:
    types: [published]   # 🔥 Se déclenche uniquement quand une release est publiée

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - image: dhcp-server
            file: DOCKERFILE
            tag: latest

          - image: dmz-router-external
            file: DOCKERFILE
            tag: latest

          - image: dmz-router-internal
            file: DOCKERFILE
            tag: latest

          - image: dns-server
            file: DOCKERFILE
            tag: latest

          # --- EVE flavors ---
          - image: eve
            file: DOCKERFILE
            tag: bare
          - image: eve
            file: DOCKERFILE-LIGHT
            tag: light
          - image: eve
            file: DOCKERFILE-FULL
            tag: full

          - image: http-server
            file: DOCKERFILE
            tag: latest

          - image: pc1
            file: DOCKERFILE
            tag: latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare lowercase owner name
        id: vars
        run: echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Extract release version
        id: get_version
        run: |
          version=${GITHUB_REF#refs/tags/}
          echo "version=${version}" >> $GITHUB_ENV
          echo "📦 Building release version: ${version}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Special case for Juice Shop HTTP Server ---
      - name: Clone OWASP Juice Shop (only for http-server)
        if: matrix.image == 'http-server'
        run: |
          git clone https://github.com/juice-shop/juice-shop.git /tmp/juice-shop
          cd /tmp/juice-shop
          git checkout v19.0.0
          cd -
          cp ./source/DockerFiles/http-server/DOCKERFILE /tmp/juice-shop/Dockerfile
          sed -i 's/safetyOverride: false/safetyOverride: true/' /tmp/juice-shop/config/default.yml

      - name: Build and push ${{ matrix.image }} (${{ matrix.tag }})
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image == 'http-server' && '/tmp/juice-shop' || format('./source/DockerFiles/{0}', matrix.image) }}
          file: ${{ matrix.image == 'http-server' && '/tmp/juice-shop/Dockerfile' || format('./source/DockerFiles/{0}/{1}', matrix.image, matrix.file) }}
          push: true
          tags: |
            # 🧱 Si c’est EVE → versionnée avec flavor (ex: v1.0.0-bare)
            ${{ matrix.image == 'eve' && format('ghcr.io/{0}/dockersec-eve:{1}-{2}', env.owner_lc, env.version, matrix.tag) || '' }}
            # 🧱 Si c’est EVE Light → alias "latest"
            ${{ matrix.image == 'eve' && matrix.tag == 'light' && format('ghcr.io/{0}/dockersec-eve:latest', env.owner_lc) || '' }}
            # 🧱 Autres images → tag normalisé "latest"
            ${{ matrix.image != 'eve' && format('ghcr.io/{0}/dockersec-{1}:{2}', env.owner_lc, matrix.image, matrix.tag) || '' }}
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.title=dockersec-${{ matrix.image }}
            org.opencontainers.image.description=DockerSec component ${{ matrix.image }} (${{ matrix.tag }})
            org.opencontainers.image.licenses=MIT
