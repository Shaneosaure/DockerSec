name: CompilePDF

permissions:
  contents: read

on:
  push:
    paths:
      - 'doc/documentation/**/*.tex'

  release:
    types: [published]


jobs:
  CompilePDF:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Compile LaTeX documents
        uses: xu-cheng/latex-action@v4
        with:
          root_file: doc/documentation/*/main.tex
          work_in_root_file_dir: true

      - name: Rename generated PDFs
        run: |
          mkdir -p build
          for pdf_file in doc/documentation/*/main.pdf; do
            folder=$(dirname "$pdf_file")
            name=$(basename "$folder")
            mv "$pdf_file" "build/${name}.pdf"
          done
          echo "✅ PDF files moved to build/:"
          ls -lh build/

      # 🧱 Étape 1 — Uploader en tant qu’artifact (toujours)
      - name: Upload PDFs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Documentation-PDFs
          path: build/*.pdf

      # 🧱 Étape 2 — Si déclenché par une release, upload sur la release GitHub
      - name: Attach PDFs to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}