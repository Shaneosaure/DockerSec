name: CompilePDF

permissions:
  contents: write   

on:
  push:
    tags:
      - 'v*' 
    paths:
      - 'doc/documentation/**/*.tex'

jobs:
  CompilePDF:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Compile LaTeX documents
        uses: xu-cheng/latex-action@v4
        with:
          root_file: doc/documentation/*/main.tex
          work_in_root_file_dir: true

      - name: Rename generated PDFs
        run: |
          mkdir -p build
          for pdf_file in doc/documentation/*/main.pdf; do
            folder=$(dirname "$pdf_file")
            name=$(basename "$folder")
            mv "$pdf_file" "build/${name}.pdf"
          done
          echo "✅ PDF files moved to build/:"
          ls -lh build/

      # Étape 1 — Uploader les PDF en tant qu’artifact (zip auto par GitHub)
      - name: Upload PDFs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Documentation-PDFs
          path: build/*.pdf

  # Étape 2 — Attacher l’artifact zippé à la release GitHub
  attach-to-release:
    needs: CompilePDF
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact (zip generated by GitHub)
        uses: actions/download-artifact@v4
        with:
          name: Documentation-PDFs
          path: release_files

      - name: Archive artifact as zip (in case multiple files)
        run: |
          cd release_files
          zip -r ../Documentation-PDFs.zip .
          cd ..

      - name: Upload ZIP to release
        uses: softprops/action-gh-release@v2
        with:
          files: Documentation-PDFs.zip
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
